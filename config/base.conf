# hermes (signals peer) configuration — single source of truth (house standard).
#
# Env vars enter ONLY via ${?VAR} capture below; application code reads
# hsengine.config.load_config(), never os.environ.
#
# Lattice claims on the shared host:
#   gRPC:  gaius 50051 · aegir 50151 · atelier 50251 · synth 50351
#          · metabase 50451 · signals 50551 · hermes 50651

hermes {
  version = "0.1.0"

  engine {
    # Host GPU count for Status.total_gpus and agent-rtc packing (tinybox = 6).
    total_gpus = 6
    total_gpus = ${?HERMES_TOTAL_GPUS}

    grpc {
      host = "0.0.0.0"
      host = ${?HERMES_GRPC_HOST}
      port = 50651
      port = ${?HERMES_GRPC_PORT}
    }

    # Federated Complete: forward capabilities to peer engines. Routes are
    # PLANNED from each peer's Engine/Status — a peer is used only for the
    # capabilities it advertises. Never expose peer vLLM ports (peers own GPUs).
    federation {
      peers = [
        "127.0.0.1:50051",  # gaius  (thinking)
        "127.0.0.1:50151",  # aegir  (instruct)
      ]
      peers = ${?HSENGINE_FEDERATION_PEERS}
      timeout_s = 1200
      timeout_s = ${?HSENGINE_COMPLETE_TIMEOUT_S}
      # Product capability -> peer capabilities accepted for it, best first.
      capability_map {
        agent    = ["thinking", "instruct"]
        instruct = ["thinking", "instruct"]
      }
      status_ttl_s = 5
      status_ttl_s = ${?HSENGINE_STATUS_TTL_S}
      # Lattice hub to Announce to (in addition to federation.peers).
      directory = ""
      directory = ${?SIGNALS_ENGINE_TARGET}
      announce_ttl_s = 90
      announce_ttl_s = ${?HSENGINE_ANNOUNCE_TTL_S}
    }

    # Explicit OIP-only peers (plain KServe / CIS). Empty = use federation.peers.
    oip {
      peers = []
      peers = ${?HSENGINE_OIP_PEERS}
      timeout_s = 120
      timeout_s = ${?HSENGINE_OIP_TIMEOUT_S}
    }

    lineage {
      atlas_url = "http://127.0.0.1:21010/api/v1/lineage"
      atlas_url = ${?SIGNALS_ATLAS_OL_URL}
    }

    # Engine-local WebRTC (not zndx.engine.v1). Outbound video is the
    # current forward-sim clip; override with HERMES_WEBRTC_VIDEO.
    webrtc {
      video = "/raid/build/hermes/data/hermes-artifacts/webrtc/demo.mp4"
      video = ${?HERMES_WEBRTC_VIDEO}
      # Cloudflare Zero Trust FQDN + Caddy TLS port (getUserMedia).
      join_url = "https://tinybox.dev.vista.zndx.org:9120/listen"
      join_url = ${?HERMES_AGENT_RTC_JOIN_URL}
      # Overlay STT is Kyutai STT via moshi-server only. No whisper/CPU path.
      # YK: agent-rtc 1 GPU (moshi) while a session runs; Cerebras is
      # token-metered (no GPU); CPU search/Qdrant is compute (no GPU).
      # Gaius thinking on heavy (GPUs 0-3) stays up — not hold-uptime.
      stt {
        moshi_url = "ws://127.0.0.1:5080/api/asr-streaming"
        moshi_url = ${?HERMES_WEBRTC_MOSHI_URL}
        moshi_key = "public_token"
        moshi_key = ${?HERMES_WEBRTC_MOSHI_KEY}
      }
      tts {
        moshi_url = "ws://127.0.0.1:5080/api/tts_streaming"
        moshi_url = ${?HERMES_WEBRTC_TTS_URL}
        moshi_key = "public_token"
        moshi_key = ${?HERMES_WEBRTC_TTS_KEY}
        # VCTK p329: Unmute Watercooler English female, CC BY 4.0. Casual read male.
        voice = "unmute-prod-website/p329_022.wav"
        voice = ${?HERMES_WEBRTC_TTS_VOICE}
      }
      interactive {
        control = "http://127.0.0.1:5081"
        control = ${?HERMES_WEBRTC_MOSHI_CONTROL}
        cerebras_url = "https://api.cerebras.ai/v1"
        cerebras_model = "qwen-3.8-27b"
        cerebras_model = ${?HERMES_WEBRTC_CEREBRAS_MODEL}
        reasoning_effort = "low"
        # The interactive session is declared to the federation as a
        # coordination Activity (kind interactive_session) through this
        # engine → Signals → Airflow. Airflow OBSERVES the session through a
        # Signals-held lease: this engine heartbeats it every activity_heartbeat_s
        # (must stay well under Signals' 180 s lease TTL) and the horizon is the
        # session's outer bound, re-set on every heartbeat. Claims (YK, only
        # while RUNNING): agent-rtc gpu=1 (moshi), token-metered gpu=0
        # (Cerebras dialog), compute gpu=0 (CPU search/Qdrant). Postures empty:
        # Gaius thinking stays up. Precludes empty: light/medium keep admitting.
        activity_horizon_s = 3600
        activity_horizon_s = ${?HERMES_INTERACTIVE_ACTIVITY_HORIZON_S}
        activity_heartbeat_s = 60
        activity_heartbeat_s = ${?HERMES_INTERACTIVE_ACTIVITY_HEARTBEAT_S}
        activity_precludes = []
        activity_postures = []
      }
    }

    # Coordination Activities (signals-protocol coordination_activities.md).
    # This ENGINE is the only Hermes process that speaks to the Signals engine;
    # local processes read Activities from this engine (ServerQuery ACTIVITIES,
    # supervision ActivityEvent). Never an Airflow URL here.
    coordination {
      target = "127.0.0.1:50551"
      target = ${?SIGNALS_ENGINE_TARGET}
      watch = true
      watch = ${?HERMES_COORDINATION_WATCH}
      # Submit this engine's WORKLOAD CATALOGUE (Scheduler/SyncWorkloads) at start
      # and every 30 min: the interactive agent-rtc workflow, source=engine —
      # catalogued for federation visibility; its claims are asserted by the
      # arbiter only while a session's Activity runs.
      sync = true
      sync = ${?HERMES_COORDINATION_SYNC}
    }
  }

  # Product surfaces advertised in Engine/Status.surfaces (signals-protocol
  # surfaces.md). Never loopback. Default is the lab lattice host siblings use.
  dashboard {
    http {
      base_url = "http://127.0.0.1:9119"
      base_url = ${?HERMES_DASHBOARD_URL}
      bind_host = "0.0.0.0"
      bind_host = ${?HERMES_DASHBOARD_BIND_HOST}
      bind_port = 9119
      bind_port = ${?HERMES_DASHBOARD_PORT}
      health_path = "/api/health"
      advertise_host = "tinybox.dev.vista.zndx.org"
      advertise_host = ${?HERMES_ADVERTISE_HOST}
      primary_ui = ""
      primary_ui = ${?HERMES_PRIMARY_UI}
    }
  }

  gateway {
    http {
      base_url = "http://127.0.0.1:8642"
      base_url = ${?HERMES_GATEWAY_URL}
      bind_port = 8642
      bind_port = ${?HERMES_GATEWAY_PORT}
      health_path = "/health"
    }
  }
}
