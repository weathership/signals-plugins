# Kyutai STT + TTS on one moshi-server worker (one GPU).
# STT: Candle BatchedAsr (captions). TTS: Py DSM 1.6B (Cerebras read-aloud).
# Not the 7B Moshi dialogue model.
static_dir = "./static/"
log_dir = "./logs"
instance_name = "hermes-agent-rtc"
authorized_ids = ["public_token"]

[modules.asr]
path = "/api/asr-streaming"
type = "BatchedAsr"
lm_model_file = "hf://kyutai/stt-1b-en_fr-candle/model.safetensors"
text_tokenizer_file = "hf://kyutai/stt-1b-en_fr-candle/tokenizer_en_fr_audio_8000.model"
audio_tokenizer_file = "hf://kyutai/stt-1b-en_fr-candle/mimi-pytorch-e351c8d8@125.safetensors"
asr_delay_in_tokens = 6
batch_size = 4
conditioning_learnt_padding = true
temperature = 0.0

[modules.asr.model]
audio_vocab_size = 2049
text_in_vocab_size = 8001
text_out_vocab_size = 8000
audio_codebooks = 32

[modules.asr.model.transformer]
d_model = 2048
num_heads = 16
num_layers = 16
dim_feedforward = 8192
causal = true
norm_first = true
bias_ff = false
bias_attn = false
context = 750
max_period = 100000
use_conv_block = false
use_conv_bias = true
gating = "silu"
norm = "RmsNorm"
positional_embedding = "Rope"
conv_layout = false
conv_kernel_size = 3
kv_repeat = 1
max_seq_len = 40960

[modules.asr.model.extra_heads]
num_heads = 4
dim = 6

# Cerebras return text → one voice on the WebRTC mix (takes precedence over clip audio).
[modules.tts_py]
type = "Py"
path = "/api/tts_streaming"
text_tokenizer_file = "hf://kyutai/tts-1.6b-en_fr/tokenizer_spm_8k_en_fr_audio.model"
batch_size = 1
text_bos_token = 1

[modules.tts_py.py]
log_folder = "./logs"
voice_folder = "hf-snapshot://kyutai/tts-voices/**/*.safetensors"
# VCTK p329: Unmute Watercooler English female, CC BY 4.0. Casual read male.
default_voice = "unmute-prod-website/p329_022.wav"
cfg_coef = 2.0
cfg_is_no_text = true
padding_between = 1
padding_bonus = 0.15
n_q = 32
