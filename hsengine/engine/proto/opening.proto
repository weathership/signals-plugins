// AgentRTC opening catalog. Iterate the textproto; do not grow a Python enum.
//
// Synth vocabulary (docs/scratch/2026-08-09/153621_device_model_fsm.md):
//   gesture  — atomic move
//   sequence — ordered gestures with pacing (pause is a gesture)
//   objective — a natural first turn that uses what is actually available
syntax = "proto3";

package hsengine.opening;

message Gesture {
  string id = 1;
  // Eligibility tags (AND). "always" is a tautology.
  // Known tags: always, returning, has_thoughts, has_fresh, has_agenda, stale, empty
  repeated string when = 2;
  float weight = 3;
  string instruction = 4;
}

message PauseAfter {
  int32 after = 1;  // 1-based index of a *content* gesture
  float p = 2;
}

message SequencePolicy {
  int32 min_gestures = 1;
  int32 max_gestures = 2;
  repeated PauseAfter pause_after = 3;
}

message Catalog {
  repeated Gesture gesture = 1;
  SequencePolicy sequence = 2;
}
